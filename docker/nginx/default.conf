# Single entry point: the Laravel API (PHP-FPM) and the Next.js dashboard.
# Terminate TLS in front of this (load balancer, Caddy, Traefik) in production.

upstream masroof_web {
    server web:3000;
    keepalive 16;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    # Receipts are up to 10 MB.
    client_max_body_size 12m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;

    # Laravel: versioned API, health check and (non-production) API docs.
    location ~ ^/(api|up|docs)(/|$) {
        fastcgi_pass api:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/backend/public;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_PROTO $forwarded_proto;
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Next.js serves the dashboard and its backend-for-frontend under /api/backend… which
    # must not reach Laravel, so it is matched before the generic /api rule.
    location ^~ /api/backend/ {
        proxy_pass http://masroof_web;
        include /etc/nginx/conf.d/proxy.inc;
    }

    location ^~ /api/auth/ {
        proxy_pass http://masroof_web;
        include /etc/nginx/conf.d/proxy.inc;
    }

    location /_next/static/ {
        proxy_pass http://masroof_web;
        include /etc/nginx/conf.d/proxy.inc;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://masroof_web;
        include /etc/nginx/conf.d/proxy.inc;
    }
}
