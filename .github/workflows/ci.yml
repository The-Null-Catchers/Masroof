name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      mobile: ${{ steps.filter.outputs.mobile }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend: ['backend/**', 'docker/php/**', '.github/workflows/ci.yml']
            web: ['web/**', '.github/workflows/ci.yml']
            mobile: ['mobile/**', 'branding/**', '.github/workflows/ci.yml']
            docker: ['docker/**', 'compose.yaml', 'backend/**', 'web/**', '.github/workflows/ci.yml']

  backend:
    name: Backend (Laravel)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: masroof
          POSTGRES_PASSWORD: masroof
          POSTGRES_DB: masroof_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U masroof" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, intl, bcmath, zip, gd, redis
          coverage: none
          tools: composer:v2
      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Code style (Pint)
        run: vendor/bin/pint --test
      - name: Static analysis (Larastan)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress
      - name: Tests
        run: php artisan test
      - name: OpenAPI spec is up to date
        run: |
          composer docs:openapi
          if ! git diff --quiet -- ../docs/openapi.json; then
            git diff --stat -- ../docs/openapi.json
            git diff -- ../docs/openapi.json | head -80
            echo "::error::docs/openapi.json is stale. Run 'composer docs:openapi' in backend/."
            exit 1
          fi

  web:
    name: Web (Next.js)
    needs: changes
    if: needs.changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  mobile:
    name: Mobile (Flutter)
    needs: changes
    if: needs.changes.outputs.mobile == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true
      - run: flutter pub get
      - name: Generated code is up to date
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- lib || (echo "::error::Generated files are stale. Run gen-l10n and build_runner." && exit 1)
      - name: Format
        # Generated sources keep their generator's formatting.
        run: find lib test -name '*.dart' ! -name '*.g.dart' ! -path 'lib/l10n/generated/*' -print0 | xargs -0 dart format --line-length 120 --output=none --set-exit-if-changed
      - name: Analyze
        run: flutter analyze
      - name: Tests
        run: flutter test
      - name: Build APK and App Bundle
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          MASROOF_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MASROOF_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MASROOF_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          API_URL: ${{ vars.MASROOF_API_URL }}
        run: |
          # Signed with the release keystore when the secrets exist (not on forks); debug-signed otherwise.
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export MASROOF_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          fi
          DEFINES="--dart-define=MASROOF_VERSION=${GITHUB_SHA::7}"
          if [ -n "$API_URL" ]; then DEFINES="$DEFINES --dart-define=MASROOF_API_URL=$API_URL"; fi
          flutter build apk --release $DEFINES
          flutter build appbundle --release $DEFINES
      - uses: actions/upload-artifact@v4
        with:
          name: masroof-android-${{ github.sha }}
          path: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

  docker:
    name: Docker images
    needs: changes
    if: needs.changes.outputs.docker == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate compose file
        run: |
          cp .env.example .env
          sed -i 's/^APP_KEY=$/APP_KEY=base64:ci-only-not-a-real-key/' .env
          docker compose config --quiet
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile
          target: prod
          tags: masroof-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web/Dockerfile
          tags: masroof-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
