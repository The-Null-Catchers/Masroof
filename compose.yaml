# Masroof production-like stack.
#
#   cp .env.example .env            # then set APP_KEY and passwords
#   docker compose up -d --build
#   open http://localhost:8080
#
# See docs/deployment.md for details.

x-backend: &backend
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: prod
  image: masroof-api:${MASROOF_VERSION:-latest}
  restart: unless-stopped
  environment: &backend-env
    APP_NAME: Masroof
    APP_ENV: ${APP_ENV:-production}
    APP_KEY: ${APP_KEY:?Set APP_KEY in .env (docker compose run --rm migrate php artisan key:generate --show)}
    APP_DEBUG: "false"
    APP_URL: ${APP_URL:-http://localhost:8080}
    FRONTEND_URL: ${APP_URL:-http://localhost:8080}
    CORS_ALLOWED_ORIGINS: ${APP_URL:-http://localhost:8080}
    APP_LOCALE: ar
    APP_FALLBACK_LOCALE: en
    LOG_CHANNEL: stderr
    LOG_LEVEL: ${LOG_LEVEL:-info}
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_DATABASE: ${DB_DATABASE:-masroof}
    DB_USERNAME: ${DB_USERNAME:-masroof}
    DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    REDIS_CLIENT: phpredis
    REDIS_HOST: redis
    REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    REDIS_PORT: "6379"
    CACHE_STORE: redis
    QUEUE_CONNECTION: redis
    SESSION_DRIVER: array
    FILESYSTEM_DISK: local
    MAIL_MAILER: ${MAIL_MAILER:-log}
    MAIL_HOST: ${MAIL_HOST:-}
    MAIL_PORT: ${MAIL_PORT:-587}
    MAIL_USERNAME: ${MAIL_USERNAME:-}
    MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@masroof.app}
    MASROOF_OCR_DRIVER: ${MASROOF_OCR_DRIVER:-tesseract}
  volumes:
    # Receipts and report exports are shared by the API and the queue worker.
    - storage:/var/www/backend/storage/app
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-masroof}
      POSTGRES_USER: ${DB_USERNAME:-masroof}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: docker.io/library/redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # One-off: applies migrations before the API, worker and scheduler start.
  migrate:
    <<: *backend
    restart: "no"
    command: ["php", "artisan", "migrate", "--force", "--no-interaction"]

  api:
    <<: *backend
    command: ["sh", "-c", "php artisan optimize && exec php-fpm"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *backend
    command: ["sh", "-c", "php artisan optimize && exec php artisan queue:work --tries=3 --backoff=10 --max-time=3600"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  scheduler:
    <<: *backend
    command: ["sh", "-c", "php artisan optimize && exec php artisan schedule:work"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    image: masroof-web:${MASROOF_VERSION:-latest}
    restart: unless-stopped
    environment:
      # Server-side calls from the backend-for-frontend go through nginx on the internal network.
      MASROOF_API_URL: http://nginx:8080
      MASROOF_COOKIE_SECURE: ${MASROOF_COOKIE_SECURE:-false}

  nginx:
    image: docker.io/library/nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${MASROOF_HTTP_PORT:-8080}:8080"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/proxy.inc:/etc/nginx/conf.d/proxy.inc:ro
    depends_on:
      - api
      - web
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/up >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres:
  redis:
  storage:
